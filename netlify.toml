[build]
  command = "node scripts/assemble-db.mjs && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  AUTH_SECRET = "change-me-in-netlify-environment"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["data/clarity.db"]

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
